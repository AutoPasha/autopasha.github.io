<!DOCTYPE html>
<html lang="ru" data-theme="bumaga">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рабочее место, вариант А «пульт» — макет</title>
<link rel="stylesheet" href="css/s0.css"><link rel="stylesheet" href="css/s1.css"><link rel="stylesheet" href="css/s2.css"><link rel="stylesheet" href="css/s3.css"><link rel="stylesheet" href="css/s4.css"><link rel="stylesheet" href="css/s5.css"><link rel="stylesheet" href="css/s6.css"><link rel="stylesheet" href="css/s7.css">
<link rel="stylesheet" href="css/mock.css">
<script src="icons.js"></script><script src="mock.js"></script>
<meta property="og:type" content="website">
<meta property="og:url" content="https://design.autopasha.ru/ap-rabochee-mesto/variant-a.html">
<meta property="og:title" content="Рабочее место, вариант А «пульт» — макет">
<meta property="og:image" content="https://design.autopasha.ru/ap-rabochee-mesto/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://design.autopasha.ru/ap-rabochee-mesto/og.jpg">
</head>
<body class="min-h-dvh antialiased">
<div class="m-shell">
<main class="m-main wide">
  <header class="v9-head"><div class="v9-head-row"><a class="v9-back" aria-label="назад" href="index.html"></a><div class="min-w-0"><h1 class="v9-title">рабочее место</h1><p class="v9-head-sub">Пачка, Telegram и почта · 13 чатов · 6 человек</p></div></div></header>

  <div class="a-grid" style="margin-top:16px">
    <nav class="a-nav" id="nav"></nav>
    <section id="pane"></section>
  </div>
</main>
<div class="m-bulk" id="bulk"><span id="bulkN">выбрано 2</span><button data-b="self">сам</button><button data-b="draft">черновик</button><button data-b="silent">молча</button><button data-b="off">не читать</button></div>
</div>
<script>
shell('вариант А · пульт');
let cur = 'pachca';
const cnt = (k) => CHATS.filter((c) => c.ch === k).length;

function nav() {
  const a = (id, inner, c, cls = '') => `<a data-nav="${id}" ${cur === id ? 'aria-current="page"' : ''}>${inner}<span class="c ${cls}">${c}</span></a>`;
  document.getElementById('nav').innerHTML =
    a('new', `<span class="m-logo sm" style="background:color-mix(in oklch,var(--color-hot) 18%,transparent);color:var(--color-hot-ink)">!</span>ждут решения`, NEW_CHATS.length, 'hot') +
    a('all', `<span class="m-logo sm lg-other">${GLYPH.group}</span>все чаты`, CHATS.length) +
    '<p class="sep">мессенджеры</p>' +
    ['pachca', 'telegram', 'mail'].map((k) => a(k, `${logo(k, 'sm', 'ok')}${CH[k].name}`, cnt(k))).join('') +
    `<a data-sheet="sh-ym"><span class="m-logo sm lg-other">${GLYPH.plus}</span><span class="m-dim">подключить ещё</span></a>` +
    '<p class="sep">команда</p>' +
    a('people', `<span class="m-avas"><span class="m-ava sm" style="background:#ffc1a5;width:28px;height:28px">МГ</span></span>кто есть кто`, PEOPLE.length) +
    a('rules', `<span class="m-logo sm lg-other">⚙</span>по умолчанию`, '');
}

function chatTable(list) {
  return `<div class="m-card" style="overflow:hidden"><table class="a-table"><thead><tr><th style="width:36px"><input type="checkbox" aria-label="выбрать все"></th><th>чат</th><th class="hide-m">где</th><th class="hide-m">люди</th><th class="hide-m">последнее</th><th>как отвечает</th></tr></thead><tbody>` +
    list.map((c) => `<tr><td><input type="checkbox" class="pick"></td><td><div class="m-row" style="gap:10px">${chatIcon(c)}<div class="m-grow"><p class="m-t m-trunc" style="font-size:14px">${c.t}</p><p class="m-s">${c.type === 'dm' ? 'личка' : c.type === 'inbox' ? 'ящик' : 'группа'}${c.th ? ` · ${c.th} тредов` : ''}</p></div></div></td><td class="hide-m">${logo(c.ch, 'xs')}</td><td class="hide-m m-dim">${c.type === 'dm' ? '1' : c.n || '—'}</td><td class="hide-m m-dim">${c.last}</td><td class="seg">${seg(c.mode, c.id)}</td></tr>`).join('') +
    `</tbody></table></div>`;
}

function pane() {
  const P = document.getElementById('pane');
  if (cur === 'pachca' || cur === 'telegram' || cur === 'mail' || cur === 'all') {
    const list = cur === 'all' ? CHATS : CHATS.filter((c) => c.ch === cur);
    const c = CH[cur];
    P.innerHTML = (cur !== 'all' ? `<div class="m-card m-pad m-row a-head" style="margin-bottom:12px">${logo(cur, '', 'ok')}<div class="m-grow"><p class="m-t">${c.name} · ${c.acc}</p><p class="m-s">${c.kind} · последний ответ 2 мин назад</p></div><span class="m-state">${c.stateText}</span><button class="m-btn sm" data-sheet="sh-pachca">подключение</button></div>` : '') +
      `<div class="a-filters" style="margin-bottom:10px"><input class="m-input" placeholder="найти чат" style="max-width:260px;min-height:36px;padding:6px 12px"><button class="v9-chip" aria-pressed="true">все</button><button class="v9-chip">группы</button><button class="v9-chip">лички</button><button class="v9-chip">молча</button><button class="v9-chip">не читает</button></div>` +
      chatTable(list) +
      `<p class="m-note">Отметьте несколько чатов — снизу появится панель, режим меняется сразу у всех. Треды живут как их чат и отдельной строкой не показываются.</p>`;
  } else if (cur === 'new') {
    P.innerHTML = `<div class="m-ask">` + `<p class="m-ask-h">его позвали в новые чаты <span>${NEW_CHATS.length}</span></p><p class="m-ask-q">Работа это или нет? Пока вы не решили, он туда не смотрит.</p>` +
      NEW_CHATS.map((c) => `<div class="m-ask-row">${logo(c.ch, 'sm')}<div class="m-grow"><p class="m-t" style="font-size:14.5px">${c.t}</p><p class="m-s">${c.who} · ${c.n} человек</p></div><span class="verdict"></span><div class="m-ask-acts"><button class="yes" data-v="работа ✓">работа</button><button data-v="читает молча">молча</button><button data-v="не его">не его</button></div></div>`).join('') + `</div>`;
  } else if (cur === 'people') {
    P.innerHTML = `<div class="m-card" style="overflow:hidden"><table class="a-table"><thead><tr><th>человек</th><th class="hide-m">где</th><th class="hide-m">ставит задачи</th><th class="hide-m">принимает</th><th class="hide-m">знает про AI</th><th>особенности</th></tr></thead><tbody>` +
      PEOPLE.map((p) => `<tr><td><div class="m-row" style="gap:10px"><span class="m-ava sm" style="background:${p.c}">${p.a}</span><div><p class="m-t" style="font-size:14px">${p.n}</p><p class="m-s">${p.r}</p></div></div></td><td class="hide-m">${p.where.map((w) => logo(w, 'xs')).join(' ')}</td><td class="hide-m"><input type="checkbox" ${p.tags.includes('ставит задачи') ? 'checked' : ''}></td><td class="hide-m"><input type="checkbox" ${p.tags.includes('принимает работу') ? 'checked' : ''}></td><td class="hide-m"><input type="checkbox" ${p.tags.includes('знает, что он AI') ? 'checked' : ''}></td><td class="m-dim seg">${p.note || (p.tags.includes('снаружи') ? 'снаружи, поставщик' : '')}</td></tr>`).join('') +
      `<tr><td colspan="6" class="m-dim">ещё 17 человек из чатов без роли · <a class="m-link">показать</a></td></tr></tbody></table></div>`;
  } else {
    P.innerHTML = `<div class="m-card m-pad"><p class="m-t">Как он отвечает, если не сказано иначе</p><p class="m-s" style="margin-bottom:10px">Простое сам, сложное и всё про деньги — черновиком вам.</p><span class="m-seg" data-mode="self"><i class="pill"></i><button data-k="self" aria-pressed="true">простое сам</button><button data-k="draft" aria-pressed="false">всё через вас</button></span>
      <p class="m-t" style="margin-top:20px">В новых чатах</p><p class="m-s" style="margin-bottom:10px">Пока вы не решили по чату.</p><span class="m-seg" data-mode="silent"><i class="pill"></i><button data-k="off" aria-pressed="false">не смотрит</button><button data-k="silent" aria-pressed="true">читает молча</button><button data-k="draft" aria-pressed="false">черновиком</button></span></div>`;
  }
  placePills(P);
}

document.addEventListener('click', (e) => {
  const n = e.target.closest('[data-nav]');
  if (n) { cur = n.dataset.nav; nav(); pane(); }
});
document.addEventListener('change', (e) => {
  if (!e.target.matches('.pick, thead input')) return;
  if (e.target.matches('thead input')) document.querySelectorAll('.pick').forEach((x) => { x.checked = e.target.checked; });
  const n = document.querySelectorAll('.pick:checked').length;
  document.getElementById('bulkN').textContent = `выбрано ${n}`;
  document.getElementById('bulk').classList.toggle('on', n > 0);
});
nav(); pane();
if (location.hash === '#bulk') { document.querySelectorAll('.pick').forEach((x, i) => { if (i === 2 || i === 4) x.checked = true; }); document.getElementById('bulk').classList.add('on'); document.getElementById('bulkN').textContent = 'выбрано 2'; }
</script>
<script src="/ap/badge.js" defer data-ap="ap-rabochee-mesto"></script>
</body>
</html>
