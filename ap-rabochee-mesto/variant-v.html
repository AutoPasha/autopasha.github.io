<!DOCTYPE html>
<html lang="ru" data-theme="bumaga">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рабочее место, вариант В «правила словами» — макет</title>
<link rel="stylesheet" href="css/s0.css"><link rel="stylesheet" href="css/s1.css"><link rel="stylesheet" href="css/s2.css"><link rel="stylesheet" href="css/s3.css"><link rel="stylesheet" href="css/s4.css"><link rel="stylesheet" href="css/s5.css"><link rel="stylesheet" href="css/s6.css"><link rel="stylesheet" href="css/s7.css">
<link rel="stylesheet" href="css/mock.css">
<script src="icons.js"></script><script src="mock.js"></script>
<meta property="og:type" content="website">
<meta property="og:url" content="https://design.autopasha.ru/ap-rabochee-mesto/variant-v.html">
<meta property="og:title" content="Рабочее место, вариант В «правила словами» — макет">
<meta property="og:image" content="https://design.autopasha.ru/ap-rabochee-mesto/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://design.autopasha.ru/ap-rabochee-mesto/og.jpg">
</head>
<body class="min-h-dvh antialiased">
<div class="m-shell">
<main class="m-main wide" style="max-width:68rem">
  <header class="v9-head"><div class="v9-head-row"><a class="v9-back" aria-label="назад" href="index.html"></a><div class="min-w-0"><h1 class="v9-title">рабочее место</h1><p class="v9-head-sub">как он работает у вас — одной страницей, словами</p></div></div></header>

  <div class="v-grid" style="margin-top:16px">
    <div>
      <section class="m-ask" id="ask"></section>
      <section class="m-card" style="margin-top:12px" id="rules"></section>
      <p class="m-note">Подчёркнутое нажимается: открывается список с переключателями прямо под фразой. Фразы собираются из настроек, руками их не пишут.</p>
    </div>
    <aside class="v-prev">
      <p class="m-small m-dim" style="margin-bottom:8px;font-weight:600">так его видят коллеги</p>
      <div class="v-tabs" id="tabs"></div>
      <div class="v-phone" id="phone"></div>
    </aside>
  </div>
</main>
</div>
<script>
shell('вариант В · правила словами');
const chip = (inner, cls = '', pop = '') => `<span class="v-chip ${cls}" ${pop ? `data-pop="${pop}"` : ''}>${inner}</span>`;
const chatChip = (c) => chip(`${logo(c.ch, 'xs')}${c.t}`, '', 'p-' + c.mode);
const ofMode = (m) => CHATS.filter((c) => c.mode === m);
const pChip = (p) => chip(`<span class="m-ava sm" style="background:${p.c}">${p.a}</span>${p.n.split(' ')[0]}`);
const plural = (n, a, b, c) => (n % 10 === 1 && n % 100 !== 11 ? a : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? b : c);

function popList(m) {
  return `<div class="v-pop" id="p-${m}">` + CHATS.filter((c) => c.mode === m).map((c) => `<div class="m-row" style="padding:6px 0;flex-wrap:wrap">${logo(c.ch, 'xs')}<span class="m-grow">${c.t}</span>${seg(c.mode, c.id)}</div>`).join('') + `</div>`;
}

function rules() {
  const self = ofMode('self'), draft = ofMode('draft'), silent = ofMode('silent'), off = ofMode('off');
  const tasks = PEOPLE.filter((p) => p.tags.includes('ставит задачи'));
  const acc = PEOPLE.filter((p) => p.tags.includes('принимает работу'));
  const nod = PEOPLE.filter((p) => p.tags.includes('не дёргать'));
  document.getElementById('rules').innerHTML = `
    <div class="v-rule"><span class="lbl">где он сидит</span>Он сидит в ${chip(`${logo('pachca', 'xs')}Пачке`)}, ${chip(`${logo('telegram', 'xs')}Telegram`)} и ${chip(`${logo('mail', 'xs')}почте zakaz@`)}. ${chip('+ ещё мессенджер', 'plain')}</div>
    <div class="v-rule"><span class="lbl">где отвечает сам</span>Сам отвечает в ${chip(`${self.length} ${plural(self.length, 'чате', 'чатах', 'чатах')}`, 'self', 'p-self')}: простое сразу, сложное и всё про деньги присылает вам черновиком.${popList('self')}</div>
    <div class="v-rule"><span class="lbl">где только через вас</span>Только черновиком пишет в ${draft.slice(0, 3).map(chatChip).join(', ')}${draft.length > 3 ? ` и ${chip(`ещё ${draft.length - 3}`, 'draft', 'p-draft')}` : ''}.${popList('draft')}</div>
    <div class="v-rule"><span class="lbl">где молчит</span>Молча читает ${silent.map(chatChip).join(' и ')}, чтобы быть в курсе. Не читает ${off.map(chatChip).join(', ')}.${popList('silent')}${popList('off')}</div>
    <div class="v-rule"><span class="lbl">новые чаты</span>Когда его зовут в новый чат, он ${chip('ждёт вашего решения', 'plain')} и до тех пор туда не смотрит.</div>
    <div class="v-rule"><span class="lbl">кто есть кто</span>Задачи ему ставят ${tasks.map(pChip).join(', ')}. Работу принимают ${acc.map(pChip).join(' и ')}. ${nod.map(pChip).join('')} не дёргает: ${nod[0].note}. Остальных ${chip('17 человек', 'plain')} он уточняет у Марины.</div>`;
}

function ask() {
  document.getElementById('ask').innerHTML = `<p class="m-ask-h">его позвали в новые чаты <span>${NEW_CHATS.length}</span></p><p class="m-ask-q">Работа это или нет?</p>` +
    NEW_CHATS.map((c) => `<div class="m-ask-row">${logo(c.ch, 'sm')}<div class="m-grow"><p class="m-t" style="font-size:14.5px">${c.t}</p><p class="m-s">${c.who}</p></div><span class="verdict"></span><div class="m-ask-acts"><button class="yes" data-v="работа ✓">работа</button><button data-v="читает молча">молча</button><button data-v="не его">не его</button></div></div>`).join('');
}

const PREV = {
  pachca: { h: 'Сайт и доставка', sub: '6 участников', msgs: [['Олег', 'Паш, в Колпино опять доставка 600 ₽ считается, должно быть 350'], ['me', 'Вижу, СДЭК вернул тариф «до двери». Переключаю на пункт выдачи, через 10 минут проверю на заказе'], ['sys', 'Паша печатает…']] },
  telegram: { h: 'Зерно × Обжарка Север', sub: '5 участников · черновиком', msgs: [['Ахмед', 'Можем отгрузить эфиопию в четверг, но цена +8%'], ['sys', 'черновик ответа ушёл Марине на проверку'], ['me', 'Ахмед, добрый день! Четверг подходит, по цене уточню у Марины и вернусь до обеда']] },
  mail: { h: 'zakaz@zerno.shop', sub: 'входящие · черновиком', msgs: [['Покупатель', 'Здравствуйте! Заказ 3121 пришёл без сертификата, можно прислать?'], ['sys', 'черновик письма ждёт вас в кабинете'], ['me', 'Здравствуйте! Сертификат во вложении, извините, что не положили в посылку. Паша, лавка «Зерно»']] },
};
let pv = 'pachca';
function preview() {
  document.getElementById('tabs').innerHTML = ['pachca', 'telegram', 'mail'].map((k) => `<button class="v9-chip" data-pv="${k}" aria-pressed="${k === pv}">${logo(k, 'xs')}${CH[k].name}</button>`).join('');
  const p = PREV[pv];
  document.getElementById('phone').innerHTML = `<div class="v-phone-h">${logo(pv, 'sm')}<div><p class="m-t" style="font-size:14px">${p.h}</p><p class="m-s">${p.sub}</p></div></div><div class="v-msgs">` +
    p.msgs.map(([w, t]) => w === 'sys' ? `<div class="v-msg sys">${t}</div>` : `<div class="v-msg ${w === 'me' ? 'me' : ''}"><small>${w === 'me' ? 'Паша Зернов' : w}</small>${t}</div>`).join('') + `</div>`;
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-pv]');
  if (t) { pv = t.dataset.pv; preview(); }
  const c = e.target.closest('[data-pop]');
  if (c) { const el = document.getElementById(c.dataset.pop); if (el) { el.classList.toggle('open'); placePills(el); } }
});
ask(); rules(); preview();
if (location.hash === '#open') { document.getElementById('p-self').classList.add('open'); }
</script>
<script src="/ap/badge.js" defer data-ap="ap-rabochee-mesto"></script>
</body>
</html>
